name: Portability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/portability.yml
      - scripts/install-skill.py
      - src/**
      - tests/**
      - pyproject.toml
      - package-lock.json

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install Ubuntu video dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev fonts-noto-cjk
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[video,narration,test]"
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npm run browser:install
      - run: python scripts/install-skill.py .test-skills
      - run: python -m pytest -q
      - run: stickman-lecture voice-setup
      - run: stickman-lecture doctor --video --narration
      - run: stickman-lecture render examples/stick-interaction/scene.json --mode both --narration --preview --out output/portability
        env:
          HF_HUB_OFFLINE: '1'
