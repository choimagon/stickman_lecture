[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathscene"
version = "0.1.0"
description = "Shared scene renderer for interactive mathematics lessons"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "numpy>=2,<3", "sympy>=1.13,<2"]

[project.optional-dependencies]
video = ["manim>=0.19,<0.21"]
test = ["pytest>=8,<10"]

[project.scripts]
mathscene = "mathscene.cli:main"

[tool.setuptools.package-data]
mathscene = ["resources/*", "resources/web/*"]
